
name: build deb

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - dev
  pull_request:
    branches-ignore:
      - dev

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build packages
        shell: bash
        run: |
          set -euxo pipefail
          rm -f packages/*.deb
          make package FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
          ls -lah packages/
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Extract dylibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/debs artifacts/dylibs
          find packages -maxdepth 1 -name '*.deb' -exec cp {} artifacts/debs/ \;
          for deb in packages/*.deb; do
            [ -f "$deb" ] || continue
            tmp="$(mktemp -d)"
            dpkg-deb -x "$deb" "$tmp"
            find "$tmp" -type f -name '*.dylib' -exec cp {} artifacts/dylibs/ \;
            rm -rf "$tmp"
          done
          find artifacts -type f -print
          test -n "$(find artifacts/dylibs -name '*.dylib' -print -quit)"

      - name: Upload DYYY
        uses: actions/upload-artifact@v4
        with:
          name: DYYY-LCSing
          path: artifacts/
          if-no-files-found: error
